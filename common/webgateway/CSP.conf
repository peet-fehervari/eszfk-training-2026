# Apache configuration for the InterSystems Web Gateway container.
# Shared by every gateway in every stack - the file is identical regardless of
# which IRIS instance the gateway serves. The instance-specific part is the
# CSP.ini next to each stack's compose file.
#
# This gateway container hosts nothing of its own, so every path is handed to
# the gateway module.

CSPModulePath "${ISC_PACKAGE_INSTALLDIR}/bin/"
CSPConfigPath "${ISC_PACKAGE_INSTALLDIR}/bin/"

<Location />
    CSP On
</Location>

<Directory />
    Options MultiViews FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "\.(log|ini|pid|exe|so)$">
        Require all denied
    </FilesMatch>
</Directory>

# The portal's Help links point at local docs that this container does not host.
Redirect /csp/docbook/ http://docs.intersystems.com/irislatest/csp/docbook/
