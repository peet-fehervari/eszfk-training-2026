; Web Gateway configuration for mirror member B (host port 63774).
; Apache side is shared: ../../common/webgateway/CSP.conf
; Credentials are the container development defaults; do not use against a real instance.
;
; Bound to member B only - see the note in member-a-CSP.ini.

[SYSTEM]
IRISCONNECT_LIBRARY_PATH=/opt/webgateway/bin
System_Manager=*.*.*.*
SM_Timeout=28800
Server_Response_Timeout=60
No_Activity_Timeout=86400
Queued_Request_Timeout=60
Default_Server=MIRRORB

[SYSTEM_INDEX]
MIRRORB=Enabled

[MIRRORB]
Ip_Address=mirror-b
TCP_Port=1972
Minimum_Server_Connections=3
Maximum_Session_Connections=6
Username=CSPSystem
Password=SYS
Connection_Security_Level=0

[APP_PATH_INDEX]
/=Enabled
/csp=Enabled

[APP_PATH:/]
Default_Server=MIRRORB

[APP_PATH:/csp]
Default_Server=MIRRORB
