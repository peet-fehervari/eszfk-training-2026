; Web Gateway configuration for mirror member A (host port 63773).
; Apache side is shared: ../../common/webgateway/CSP.conf
; Credentials are the container development defaults; do not use against a real instance.
;
; This gateway is bound to member A only, deliberately. It does not follow the
; mirror: after a takeover this portal still talks to member A, and member B's
; portal on 63774 is the one showing a primary. That is what makes the role change
; observable during the exercise.

[SYSTEM]
IRISCONNECT_LIBRARY_PATH=/opt/webgateway/bin
System_Manager=*.*.*.*
SM_Timeout=28800
Server_Response_Timeout=60
No_Activity_Timeout=86400
Queued_Request_Timeout=60
Default_Server=MIRRORA

[SYSTEM_INDEX]
MIRRORA=Enabled

[MIRRORA]
Ip_Address=mirror-a
TCP_Port=1972
Minimum_Server_Connections=3
Maximum_Session_Connections=6
Username=CSPSystem
Password=SYS
Connection_Security_Level=0

[APP_PATH_INDEX]
/=Enabled
/csp=Enabled

[APP_PATH:/]
Default_Server=MIRRORA

[APP_PATH:/csp]
Default_Server=MIRRORA
