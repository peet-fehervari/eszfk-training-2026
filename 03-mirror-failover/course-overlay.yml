# Optional overlay: keeps the "Managing InterSystems Servers" course directories across a
# recreate, and adds the mail server and the arbiter some modules need. See
# ../common/course/README.md.
#
#   docker compose -f docker-compose.yml -f course-overlay.yml up -d
#   ../common/course/prepare-instance.sh training-mirror-a training-mirror-b
#
# The volumes arrive root-owned - Docker creates a mount point for a path that does not
# exist in the image as root - so prepare-instance.sh is still what makes them usable.
# Run it once after every recreate.
#
# Both members get the directories: the mirroring module has the participant work on both
# machines, and the course text uses the same paths on each.

services:
  mirror-a:
    volumes:
      # The paths the exercise text types, in the order it introduces them.
      - a_management:/Management
      - a_databases:/databases
      - a_backups:/backups
      - a_journals:/journals
      - a_encryption:/InterSystems
      # Somewhere for ^SystemPerformance and Diagnostic Report output that can be opened
      # in a browser on the host without docker cp. Shared by all stacks, and a bind
      # mount, so it carries the host user's ownership: `chmod 777` it once (no sudo
      # needed) or IRIS cannot write there.
      - ../common/course/out:/irisdev/out

  mirror-b:
    volumes:
      - b_management:/Management
      - b_databases:/databases
      - b_backups:/backups
      - b_journals:/journals
      - b_encryption:/InterSystems
      - ../common/course/out:/irisdev/out

  # The course's mirroring module asks for "Use Arbiter: Yes". This stack has none by
  # design - without one, takeover is a manual operator decision, which is that stack's
  # lesson - so the arbiter is here, opt-in, and only for the course.
  #
  # An arbiter is an ISCAgent on a third machine and nothing else, so this is the same
  # image started with --up false: iris-main starts the agent and leaves IRIS down. No
  # licence key and no volumes; an arbiter stores nothing. Use the address "arbiter" and
  # port 2188 in the Create Mirror form - the service name, not localhost.
  #
  #   docker compose -f docker-compose.yml -f course-overlay.yml --profile arbiter up -d
  arbiter:
    image: ${IRIS_IMAGE:-containers.intersystems.com/intersystems/iris:2026.1}
    container_name: course-arbiter
    hostname: arbiter
    profiles: ["arbiter"]
    restart: unless-stopped
    entrypoint: ["/tini", "--", "/iris-main", "--up", "false"]
    ports:
      - "${PORT_ARBITER_AGENT:-63190}:2188"
    networks:
      - training
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # The course uses MailSlurper on the Windows VM for the ^MONMGR, Task Manager and
  # two-factor exercises. MailHog is the same idea in a container: SMTP in on 1025,
  # a browser inbox on 8025. Configure IRIS with SMTP host "mail", port 1025.
  #
  # Behind a profile because it is the one image not from containers.intersystems.com:
  # where Docker Hub is unreachable the pull fails, and in the default service set that
  # failure takes the IRIS instance down with it. Everything except the four
  # mail-notification exercises works without it.
  mail:
    image: ${MAILHOG_IMAGE:-mailhog/mailhog:latest}
    container_name: course-mail
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      # One mail container serves whichever stack is running - the container name is
      # the same in every overlay, so only one can exist at a time and one port pair
      # is enough. 61080 is deliberately not used: it falls inside a WinNAT-reserved
      # block on this host (see the README's note on ports).
      - "${PORT_MAIL_SMTP:-61025}:1025"
      - "${PORT_MAIL_UI:-61026}:8025"
    networks:
      - training
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  a_management:
  a_databases:
  a_backups:
  a_journals:
  a_encryption:
  b_management:
  b_databases:
  b_backups:
  b_journals:
  b_encryption:
