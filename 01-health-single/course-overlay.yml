# Optional overlay: keeps the "Managing InterSystems Servers" course directories
# across a recreate, and adds the two optional containers some modules need.
#
# The course add-on itself does not need this file. ../common/course/prepare-instance.sh
# creates the directories inside a running container, which is enough for restarts.
# What it is not enough for is `docker compose down`/`up` or any recreate: paths the
# stack does not declare as volumes live in the writable layer and go with it. Add this
# overlay and they are named volumes instead, surviving everything but `down -v`.
#
#   docker compose -f docker-compose.yml -f course-overlay.yml up -d
#   ../common/course/prepare-instance.sh training-health
#
# The volumes still arrive root-owned - Docker creates a mount point for a path that
# does not exist in the image as root - so prepare-instance.sh is still what makes them
# usable. Run it once after every recreate.
#
# Mail-notification exercises (^MONMGR, Task Manager, two-factor):
#   docker compose -f docker-compose.yml -f course-overlay.yml --profile mail up -d
#
# See ../common/course/README.md for the whole flow.

services:
  health:
    volumes:
      # The paths the exercise text types, in the order it introduces them.
      - course_management:/Management
      - course_databases:/databases
      - course_backups:/backups
      - course_journals:/journals
      - course_encryption:/InterSystems
      # Somewhere for ^SystemPerformance and Diagnostic Report output that can be
      # opened in a browser on the host without docker cp. Shared by all stacks, and
      # a bind mount, so it carries the host user's ownership: `chmod 777` it once
      # (no sudo needed) or IRIS cannot write there.
      - ../common/course/out:/irisdev/out

  # The course uses MailSlurper on the Windows VM for the ^MONMGR, Task Manager and
  # two-factor exercises. MailHog is the same idea in a container: SMTP in on 1025,
  # a browser inbox on 8025. Configure IRIS with SMTP host "mail", port 1025.
  #
  # Behind a profile because it is the one image not from containers.intersystems.com:
  # where Docker Hub is unreachable the pull fails, and in the default service set that
  # failure takes the IRIS instance down with it. Everything except the four
  # mail-notification exercises works without it.
  mail:
    image: ${MAILHOG_IMAGE:-mailhog/mailhog:latest}
    container_name: course-mail
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      # One mail container serves whichever stack is running - the container name is
      # the same in every overlay, so only one can exist at a time and one port pair
      # is enough. 61080 is deliberately not used: it falls inside a WinNAT-reserved
      # block on this host (see the README's note on ports).
      - "${PORT_MAIL_SMTP:-61025}:1025"
      - "${PORT_MAIL_UI:-61026}:8025"
    networks:
      - training
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  course_management:
  course_databases:
  course_backups:
  course_journals:
  course_encryption:
