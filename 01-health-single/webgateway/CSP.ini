; Web Gateway configuration for stack 1: points the gateway at the "health"
; service so its Management Portal becomes reachable on host port 61773.
;
; Credentials are the IRIS container development defaults (CSPSystem / SYS).
; Do not point this file at a real instance.
;
; The Apache side is shared: ../../common/webgateway/CSP.conf

[SYSTEM]
IRISCONNECT_LIBRARY_PATH=/opt/webgateway/bin
System_Manager=*.*.*.*
SM_Timeout=28800
Server_Response_Timeout=60
No_Activity_Timeout=86400
Queued_Request_Timeout=60
Default_Server=HEALTH

[SYSTEM_INDEX]
HEALTH=Enabled

[HEALTH]
; Docker service name on the stack network, and the native superserver port.
Ip_Address=health
TCP_Port=1972
Minimum_Server_Connections=3
Maximum_Session_Connections=6
Username=CSPSystem
Password=SYS
; 0 = no TLS between gateway and IRIS. Both are inside the stack's bridge
; network; this is a training environment, not a production topology.
Connection_Security_Level=0

[APP_PATH_INDEX]
/=Enabled
/csp=Enabled

[APP_PATH:/]
Default_Server=HEALTH

[APP_PATH:/csp]
Default_Server=HEALTH
